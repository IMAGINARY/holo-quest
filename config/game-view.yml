gameView:
  # Vertical position of the speech text, as a percentage from the top of the screen
  speechTextTopPercent: 25
  # Default text color for speech text
  defaultTextColor: '#cccccc'
  # Default text size for speech text (in em units)
  defaultTextSize: 3
  # Vertical position of the input control, as a percentage from the top of the screen.
  # Positions the control's anchor line: its top edge, unless the control declares
  # `anchorTop` (e.g. the drum anchors on its selected row). See docs/ui-controls.md.
  inputTopPercent: 70
  # Default color for the input control
  defaultInputColor: '#cccccc'
  # Default text size for the input control (in em units)
  defaultInputSize: 3
  # Background image shown on the back screen
  background:
    # Fade in/out transition duration (ms). Also used as the gap between
    # fade-out and fade-in when swapping from one image to another, so a
    # full image-to-image transition takes 2× this value.
    fadeDurationMs: 3000
  # Dev-mode on-screen-display bar (bottom-left); invisible when no message
  devStatusBar:
    # Text size (in em units)
    textSize: 3
    # Text color
    textColor: '#ffff00'
    # Background color
    bgColor: '#660000'
    # How long the message stays fully visible before auto-clearing (ms)
    displayDurationMs: 2000
    # Fade in/out transition duration (ms)
    fadeDurationMs: 350
