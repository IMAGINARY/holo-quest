gameView:
  # Vertical position of the speech text, as a percentage from the top of the screen
  speechTextTopPercent: 25
  # Default text color for speech text
  defaultTextColor: '#cccccc'
  # Default text size for speech text (in em units)
  defaultTextSize: 3
  # Vertical position of the input control, as a percentage from the top of the screen
  inputTopPercent: 70
  # Default color for the input control
  defaultInputColor: '#cccccc'
  # Default text size for the input control (in em units)
  defaultInputSize: 3
