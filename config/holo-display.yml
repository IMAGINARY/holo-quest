# The Holo-Display™ is based on the pepper's ghost illusion.
# The "front" screen is the virtual screen reflected on the glass,
# while the "back" screen is seen directly through the glass.
# Both screens are rendered on a single browser viewport and split into two different computer
# monitors through OS-level window management.
holoDisplay:
  # When true, both screens are overlaid on a single monitor with CSS blend mode
  # to approximate the pepper's ghost effect without the physical hardware.
  simulationMode: false
  # Distribution of the two screens in the browser viewport.
  # Options:
  # - vertical: the two screens are distributed vertically, touching by their long edges.
  # - horizontal: the two screens are distributed horizontally, touching by their short edges.
  screenDistribution: vertical
  # By default the "front" screen is rendered on the left (for vertical distribution) or
  # top (for horizontal distribution) side of the browser viewport.
  # Setting this option to true will invert this order.
  invertScreenOrder: false
  # Shared dimensions for both screens in pixels.
  width: 1920
  height: 1080
  # Per-screen configuration:
  # - rotated: whether the screen is rotated by 180 degrees.
  # - brightness: CSS brightness multiplier (1 = unchanged).
  # - scaleX/Y: Content scale factor in X/Y direction (1 = unchanged).
  # - offsetX/Y: Content translation in X/Y direction in pixels (0 = unchanged)
  screens:
    front:
      rotated: false
      brightness: 1
      scaleX: 1
      scaleY: 1
      offsetX: 0
      offsetY: 0
    back:
      rotated: false
      brightness: 1
      scaleX: 1
      scaleY: 1
      offsetX: 0
      offsetY: 0
