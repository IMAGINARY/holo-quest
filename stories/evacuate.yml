id: evacuate
capture:
  cond: surveyConsent = 1
  flags: ['*']
items:
  - id: start
    text:
      en: |
        Your story begins. 
        Are you ready?
      de: |
        Deine Geschichte beginnt. 
        Bist du bereit?
    responses:
      - text:
          en: Yes
          de: Ja
        then: bg-living_room
  - id: bg-living_room
    type: effect
    effect:
      type: bg_image
      options:
        path: stories/evacuate/images/living-room.png
      phase: start
    then: ready
  - id: ready
    text:
      en: |
        It is Friday. You just got home and are ready for the weekend! 
        What time is it?
      de: |
        Es ist Freitag. Du bist zu Hause und reif fürs Wochenende! 
        Wie spät ist es?
    responseFlag: readyTime
    responseControl: drum
    responses:
      - text:
          en: 4 pm
          de: 16 Uhr
        value: "16:00"
        then: abendprogramm
      - text:
          en: 5 pm
          de: 17 Uhr
        value: "17:00"
        then: abendprogramm
      - text:
          en: 6 pm
          de: 18 Uhr
        value: "18:00"
        then: abendprogramm
      - text:
          en: 7 pm
          de: 19 Uhr
        value: "19:00"
        then: abendprogramm
      - text:
          en: 8 pm
          de: 20 Uhr
        value: "20:00"
        then: abendprogramm
  - id: abendprogramm
    text:
      en: "Your plan for the evening is:"
      de: "Dein Plan für den Abend ist:"
    responseFlag: readyPlan
    responseControl: drum
    responses:
      - text:
          en: gaming
          de: zocken
        value: gaming
        then: ein-videospiel-spielen
      - text:
          en: reading
          de: lesen
        value: reading
        then: ein-buch-lesen
      - text:
          en: going out
          de: ausgehen
        value: going-out
        then: ausgehen
      - text:
          en: sleeping
          de: schlafen
        value: sleeping
        then: schlafen
      - text:
          en: working
          de: arbeiten
        then: arbeiten
        value: working
      - text:
          en: watching TV
          de: fernsehen
        value: watching-tv
        then: eine-serie-schauen
      - text:
          en: cooking
          de: kochen
        value: cooking
        then: abendessen-kochen
      - text:
          en: diary writing
          de: Tagebuch schreiben
        then: tagebuch-schreiben
        value: diary-writing
      - text:
          en: tidying up
          de: aufräumen
        then: aufraeumen
        value: tidying-up
      - text:
          en: listening to music
          de: Musik hören
        then: musik-hoeren
        value: listening-to-music
      - text:
          en: holiday planning
          de: Urlaub planen
        then: urlaub-planen
        value: holiday-planning
  - id: ein-videospiel-spielen
    text:
      en: |
        The final boss is almost defeated. 
        A text from your neighbor flashes up on your phone: 
        "ARE YOU OK?"
      de: |
        Der Endgegner ist fast besiegt. 
        Auf dem Handy blinkt eine Nachricht von deinem Nachbarn: 
        “ALLES OK BEI DIR?”
    sound: stories/evacuate/audio/notification.aac
    responseFlag: neighborText
    responses:
      - text:
          en: '"Yes, you?"'
          de: “Ja, bei dir?”
        value: reply
        then: weitermachen2-audio
      - text:
          en: Write back later
          de: Ich antworte später
        value: "postpone"
        then: weitermachen-audio
  - id: weitermachen2-audio
    type: effect
    effect:
      type: sound
      options:
        path: stories/evacuate/audio/siren.mp3
      phase: start
    then: weitermachen2
  - id: weitermachen2
    text:
      en: |
        Minutes pass, no answer. 
        Suddenly, you hear sirens. 
        What goes through your mind?
      de: |
        Einige Minuten später, keine Antwort. 
        Plötzlich hörst du Sirenengeheul. 
        Was geht dir durch den Kopf?
#    sound: stories/evacuate/audio/siren.mp3
    responseFlag: sirenStressLevel
    responses:
      - text:
          en: |
            ARGHH, 
            I hate sirens!
          de: |
            Ahhhh, ich 
            hasse Sirenen!
        value: 8
        then: ich-hasse-sirenen
      - text:
          en: | 
            Maybe something 
            happened?
          de: |
            Ist vielleicht 
            was passiert?
        value: 6
        then: oh-ist-was-passiert
      - text:
          en: |
            Pretty 
            annoying
          de: |
            Ganz schön 
            nervig
        value: 4
        then: ganz-schoen-laut-und-nervig
      - text:
          en: |
            Surely a 
            test alarm
          de: |
            Sicher ein 
            Probealarm
        value: 2
        then: bestimmt-ein-fehlalarm
  - id: ich-hasse-sirenen
    text:
      en: Your heart is racing.
      de: Dein Herz rast.
    responseFlag: sirenReaction
    responses:
      - text:
          en: Breathe slowly
          de: Ich atme langsam durch
        value: breathe
        then: ich-schliesse-die-fenster-zur-strasse-audio
      - text:
          en: Put headphones on
          de: Ich setze Kopfhörer auf
        value: headphones
        then: ich-setze-kopfhoerer-auf-audio
      - text:
          en: Back to my activity
          de: Weiter mit dem Abendprogramm
        value: ignore
        then: ich-mache-nichts-audio
  - id: ich-schliesse-die-fenster-zur-strasse-audio
    type: effect
    effect:
      type: sound
      options:
        path: stories/evacuate/audio/siren.mp3
      phase: end
    then: ich-schliesse-die-fenster-zur-strasse
  - id: ich-schliesse-die-fenster-zur-strasse
    text:
      en: The siren has stopped. How do you feel?
      de: Die Sirene hat aufgehört. Wie fühlst du dich?
    responseFlag: sirenFeeling
    responses:
      - text:
          en: panicked
          de: In Panik
        value: panicked
        then: emoji-weiter
#      - text:
#          en: terrified
#          de: Verängstigt
#        value: terrified
#        then: emoji-weiter
      - text:
          en: stressed
          de: Gestresst
        value: stressed
        then: emoji-weiter
      - text:
          en: confused
          de: Verwirrt
        value: confused
        then: emoji-weiter
      - text:
          en: alert
          de: Wachsam
        value: alert
        then: emoji-weiter
      - text:
          en: calm
          de: Gelassen
        value: calm
        then: emoji-weiter
#      - text:
#          en: bored
#          de: Gelangweilt
#        value: bored
#        then: emoji-weiter
  - id: emoji-weiter
    text:
      en: What do you do now?
      de: Was machst du jetzt?
    responseFlag: nextAction
    responses:
      - text:
          en: |
            Scroll through 
            social media
          de: |
            Ich scrolle auf 
            Social Media
        value: social-media
        then: social-media
      - text:
          en: |
            Look out 
            the window
          de: |
            Ich schaue aus 
            dem Fenster
        value: window
        then: fenster
      - text:
          en: |
            Go back to 
            my activity
          de: |
            Zurück zum 
            Abendprogramm
        value: activity
        then: weiter
  - id: social-media
    text:
      en: '"Another world war bomb found -- youngsters play with fireworks -- a
        chemical plant is on fire -- again a leak in our ice skating rink --
        song contest delayed"'
      de: '"Weltkriegsbombe gefunden -- Jugendliche spielen mit Feuerwerk --
        Chemiewerk steht in Flammen -- Schon wieder ein Leck in der Eislaufbahn
        -- Song Contest verschoben“'
    responses:
      - text:
          en: Continue my evening
          de: Ich mache weiter
        then: weiter
  - id: weiter
    text:
      en: |
        Your phone rings, and the battery dies. 
        You plug it in and open the app:
      de: |
        Dein Handy klingelt, im selben Moment geht der Akku aus. 
        Du lädst es und öffnest die App:
    sound: stories/evacuate/audio/ring-off.aac
    responseFlag: socialMediaApp
    responseControl: drum
    responses:
      - text:
          en: Instagram
          de: Instagram
        value: instagram
        then: nina-nein
      - text:
          en: Signal
          de: Signal
        value: signal
        then: nina-nein
      - text:
          en: TikTok
          de: TikTok
        value: tiktok
        then: nina-nein
      - text:
          en: NINA
          de: NINA
        value: nina
        then: nina-ja
      - text:
          en: WhatsApp
          de: WhatsApp
        value: whatsapp
        then: nina-nein
      - text:
          en: X
          de: X
        value: x
        then: nina-nein
      - text:
          en: YouTube
          de: YouTube
        value: youtube
        then: nina-nein
  - id: nina-nein
    text:
      en: |
        A lot of posts, videos, and messages, 
        the siren sounds again.
      de: |
        Viele Posts, Videos und Nachrichten. 
        Die Sirene ertönt erneut.
    sound: stories/evacuate/audio/siren.mp3
    responseFlag: siren2Reaction
    responses:
      - text:
          en: |
            Seach local 
            social media posts
          de: |
            Ich suche lokale 
            Posts in Social Media
        value: social-media
        then: social-media-2
      - text:
          en: |
            Check local 
            internet news
          de: |
            Ich checke 
            das Internet
        value: internet
        then: internet
      - text:
          en: |
            Wait a 
            little longer
          de: |
            Ich warte 
            noch etwas
        value: wait
        then: warten
  - id: social-media-2
    text:
      en: |
        "Danger! Evacuate! Fire! Act now! 
        Toxic cloud! This is real! Not fake!"
      de: |
        "Gefahr! Evakuierung! Brand! Umgehend handeln! 
        Giftige Wolke! Das ist real! No Fake!"
    responseFlag: socialMediaReaction
    responses:
      - text:
          en: |
            Check local 
            internet news
          de: |
            Ich checke lokale 
            News im Internet
        value: internet
        then: internet
      - text:
          en: |
            Pack my 
            things
          de: |
            Ich packe 
            meine Sachen
        value: pack
        then: packen
      - text:
          en: |
            Wait a 
            little longer
          de: |
            Ich warte 
            noch etwas
        value: wait
        then: durchsage
  - id: internet
    text:
      en: |
        The chemical plant in your area is on fire. 
        You see footage of emergency services. 
        Your neighborhood is being evacuated.
      de: |
        Das Chemiewerk in deinem Viertel brennt. 
        Du siehst Bilder von Einsatzkräften. 
        Die Gegend wird evakuiert.
    responseFlag: internetReaction
    responses:
      - text:
          en: |
            Go to my 
            neighbor
          de: |
            Ich gehe 
            zum Nachbarn
        value: neighbor
        then: bg-hallway
      - text:
          en: |
            Contact 
            family
          de: |
            Ich kontaktiere 
            meine Familie
        value: family
        then: familie
      - text:
          en: |
            Pack my 
            things
          de: |
            Ich packe 
            meine Sachen
        value: pack
        then: packen
      - text:
          en: |
            Leave 
            the flat
          de: |
            Ich verlasse 
            die Wohnung
        value: leave
        then: bg-street-2
      - text:
          en: |
            Wait a 
            little longer
          de: |
            Ich warte 
            noch etwas
        value: wait
        then: durchsage
  - id: bg-hallway
    type: effect
    effect:
      type: bg_image
      options:
        path: stories/evacuate/images/hallway.png
      phase: start
    then: nachbar
  - id: nachbar
    text:
      en: |
        You find your neighbor, who is just being picked up by a friend. 
        They thank you for checking. What's next?
      de: |
        Du findest deinen Nachbarn, der gerade von einem Freund abgeholt wird. 
        Sie bedanken sich fürs Nachschauen. Und jetzt?
    responseFlag: neighborReaction
    responses:
      - text:
          en: |
            Pack my 
            things
          de: |
            Ich packe 
            meine Sachen
        value: pack
        then: packen
      - text:
          en: |
            Leave 
            the flat
          de: |
            Ich verlasse 
            die Wohnung
        value: leave
        then: bg-street-2
      - text:
          en: |
            Wait a 
            little longer
          de: |
            Ich warte 
            noch etwas
        value: wait
        then: durchsage
  - id: packen
    text:
      en: |
        Emergency bag ready! 
        Keys, phone, clothes, toiletries...
      de: |
        Das Notfallgepäck ist dabei! 
        Schlüssel, Handy, Kleidung, Hygienesachen, ...
    responses:
      - text:
          en: |
            Leave 
            the flat
          de: |
            Ich verlasse 
            die Wohnung
        then: bg-street
  - id: bg-street
    type: effect
    effect:
      type: bg_image
      options:
        path: stories/evacuate/images/street.png
      phase: start
    then: strassenszene
  - id: strassenszene
    text:
      en: |
        You're on the street. What's that smell? 
        You hear sirens, and blue lights are reflected in the puddles. 
        How do you feel?
      de: |
        Du bist auf der Straße. Riecht die Luft komisch? 
        Du hörst Sirenen, Blaulicht spiegelt sich in den Pfützen. 
        Wie fühlst du dich?
    sound: stories/evacuate/audio/ambulance.aac
    responseFlag: streetFeeling
    responses:
      - text:
          en: panicked
          de: In Panik
        then: emoji-weiter2
        value: panicked
#      - text:
#          en: terrified
#          de: Verängstigt
#        value: terrified
#        then: emoji-weiter2
      - text:
          en: stressed
          de: Gestresst
        value: stressed
        then: emoji-weiter2
      - text:
          en: confused
          de: Verwirrt
        value: confused
        then: emoji-weiter3
      - text:
          en: alert
          de: Wachsam
        value: alert
        then: emoji-weiter3
      - text:
          en: calm
          de: Ruhig
        value: calm
        then: emoji-weiter3
  - id: emoji-weiter2
    text:
      en: What are you afraid of?
      de: Wovor hast du Angst?
    responseFlag: fear
    responses:
      - text:
          en: |
            Someone will 
            break into 
            my flat
          de: |
            Dass jemand 
            in meine Wohnung 
            einbricht
        value: break-in
        then: entscheidung-strasse
      - text:
          en: |
            No idea 
            where to sleep 
            tonight
          de: |
            Dass ich nicht 
            weiß, wo ich 
            übernachten soll
        value: no-bed
        then: polizei-hilft
      - text:
          en: |
            I'm doing 
            something wrong
          de: |
            Dass ich etwas 
            falsch mache
        value: doing-wrong
        then: polizei-hilft
      - text:
          en: |
            None of this 
            is real
          de: |
            Dass das alles 
            nicht echt ist
        value: not-real
        then: entscheidung-strasse
  - id: entscheidung-strasse
    text:
      en: You continue walking. Where to now?
      de: Du läufst weiter. Wohin jetzt?
    responseFlag: destination
    responses:
      - text:
          en: Cycle to a friend
          de: Ich radle zu meiner Freundin
        value: friend
        then: ende-freundin
      - text:
          en: Follow the evacuation route to a shelter
          de: Ich folge der Fluchtroute in eine Notunterkunft
        value: shelter
        then: ende-notunterkunft
  - id: ende-freundin
    text:
      en: |
        You arrive soaking wet at your friend's place. 
        She prepares warm tea for you. How did everyone else get on?

        THE END
      de: |
        Du kommst klatschnass bei deiner Freundin an. 
        Sie macht dir einen warmen Tee. Wie ist es wohl anderen ergegangen?
        
        ENDE
    then: survey-consent
  - id: ende-notunterkunft
    text:
      en: |
        There are 72 people in the shelter. 
        The snack bar next door has prepared 15 kg of potato salad. 
        What happens tomorrow? Maybe breakfast?

        THE END
      de: |
        Ihr seid 72 Personen in der Notunterkunft. 
        Der Imbiss nebenan spendiert 15 kg Kartoffelsalat. 
        Wie geht es morgen weiter? Vielleicht mit Frühstück?

        ENDE
    then: survey-consent
  - id: polizei-hilft
    text:
      en: A policewoman sees that you are afraid. She guides you to an emergency
        shelter.
      de: Eine Polizistin erkennt deine Angst. Sie begleitet dich zu einer
        Notunterkunft.
    responseFlag: destination
    responses:
      - text:
          en: Go with her
          de: Ich gehe mit
        value: shelter
        then: ende-notunterkunft
      - text:
          en: Rather take a hotel
          de: Ich nehme lieber ein Hotel
        value: hotel
        then: ende-hotel
  - id: ende-hotel
    text:
      en: |
        You get the last room and are too nervous to sleep. 
        What happens tomorrow?

        THE END
      de: |
        Du bekommst das letzte Zimmer und bist zu aufgeregt, um zu schlafen. 
        Wie geht es morgen weiter?

        ENDE
    then: survey-consent
  - id: emoji-weiter3
    text:
      en: What do you think?
      de: Was denkst du?
    responseFlag: thoughts
    responses:
      - text:
          en: Are there other people in danger?
          de: Sind Menschen in Gefahr?
        value: other-people
        then: entscheidung-strasse2
      - text:
          en: How can I help?
          de: Wie kann ich helfen?
        value: help
        then: entscheidung-strasse2
      - text:
          en: Who should I inform?
          de: Wen soll ich informieren?
        value: inform
        then: entscheidung-strasse2
  - id: entscheidung-strasse2
    text:
      en: You continue walking. Where to now?
      de: Du läufst weiter. Aber wohin jetzt?
    responseFlag: destination
    responses:
      - text:
          en: Pick up my cousins
          de: Ich hole meine Cousine ab
        value: cousins
        then: verwandte
      - text:
          en: Drive to the family country home
          de: Ich fahre zur Familie aufs Land
        value: country-home
        then: ende-land
      - text:
          en: Follow the evacuation route to a shelter
          de: Ich folge der Fluchtroute in eine Notunterkunft
        value: shelter
        then: ende-notunterkunft-help
  - id: verwandte
    text:
      en: |
        You take your car and pick up your cousins. 
        You drive to the family country home. 
        How will the situation develop?

        THE END
      de: |
        Du nimmst dein Auto und holst deine Cousine ab. 
        Ihr fahrt zur Familie aufs Land. 
        Wie wird sich die Situation entwickeln?

        ENDE
    then: survey-consent
  - id: ende-land
    text:
      en: |
        The direct route was blocked. 
        After a few detours, you arrive at the family country home. 
        Do you feel relaxed here?

        THE END
      de: |
        Die direkte Route war gesperrt. 
        Nach Umwegen kommst du im Familienhaus auf dem Land an. 
        Fühlst du dich hier entspannt?

        ENDE
    then: survey-consent
  - id: ende-notunterkunft-help
    text:
      en: |
        In the emergency shelter. 
        You talk to others and assist newcomers. 
        What else can you do?

        THE END
      de: |
        In der Notunterkunft. 
        Du sprichst mit anderen und hilfst Neuankömmlingen. 
        Was kannst du noch tun?

        ENDE
    then: survey-consent
  - id: bg-street-2
    type: effect
    effect:
      type: bg_image
      options:
        path: stories/evacuate/images/street.png
      phase: start
    then: verlassen-audio
  - id: verlassen-audio
    type: effect
    effect:
      type: sound
      options:
        path: stories/evacuate/audio/storm.aac
      phase: start
    then: verlassen
  - id: verlassen
    text:
      en: |
        You head out to the street. A thunderstorm is starting. 
        You realize you forgot your phone.
      de: |
        Du läufst auf die Straße. Es fängt an zu gewittern. 
        Dir fällt auf, dass du dein Handy beim Laden vergessen hast.
    responseFlag: forgotPhone
    responses:
      - text:
          en: Quickly go back up
          de: Ich gehe schnell zurück
        value: go-back
        then: handy-zurueck2
      - text:
          en: Doesn't matter, keep walking
          de: Egal, ich will einfach weg
        value: keep-walking
        then: weg
  - id: handy-zurueck2
    text:
      en: You grab the phone, close the windows, turn off the water and gas, and
        switch off the lights. Where to now?
      de: Du nimmst das Handy mit, schließt die Fenster, drehst Wasser und Gas ab und
        machst das Licht aus. Wohin jetzt?
    responseFlag: destination
    responses:
      - text:
          en: Pick up my cousins
          de: Ich hole meine Cousine ab
        value: cousins
        then: verwandte
      - text:
          en: Drive to the family country home
          de: Ich fahre zur Familie aufs Land
        value: country-home
        then: ende-land
      - text:
          en: Take a hotel
          de: Ich nehme ein Hotel
        value: hotel
        then: ende-hotel
  - id: weg
    text:
      en: Where to? What do you do?
      de: Wohin? Was machst du?
    responseFlag: destination
    responses:
      - text:
          en: Cycle to a friend
          de: Ich radle zu meiner Freundin
        value: friend
        then: ende-freundin
      - text:
          en: Take a hotel
          de: Ich nehme ein Hotel
        value: hotel
        then: ende-hotel
  - id: durchsage
    text:
      en: You hear an evacuation announcement over a megaphone from the street. It's
        getting loud in the building.
      de: Du hörst eine Evakuierungs-Durchsage mit Megafon von der Straße. Es wird
        laut im Treppenhaus.
    responseFlag: evacuationReaction
    responses:
      - text:
          en: Leave the flat
          de: Ich verlasse die Wohnung
        value: leave
        then: bg-street
      - text:
          en: |
            Stay, an evacuation 
            never happened before
          de: |
            So eine Evakuierung 
            gab es noch nie, ich bleibe
        value: stay
        then: bleiben
  - id: bleiben
    text:
      en: The fire brigade rings your doorbell. They escort you out of the flat.
      de: Feuerwehrleute klingeln bei dir. Sie begleiten dich aus der Wohnung.
    responses:
      - text:
          en: Taken to emergency shelter!
          de: Eskortiert zur Notunterkunft!
        then: ende-notunterkunft-eskortiert
    sound: stories/evacuate/audio/dingdong.aac
  - id: ende-notunterkunft-eskortiert
    text:
      en: |
        In the old sports hall. You're cold. You're hungry. 
        You gave the emergency workers a lot of extra work. 
        Will you be able to sleep here?

        THE END
      de: |
        In der alten Turnhalle. Dir ist kalt. Du bist hungrig. 
        Du hast den Einsatzkräften viel Arbeit gemacht. 
        Wirst du hier schlafen können?

        ENDE
    then: survey-consent
  - id: familie
    text:
      en: You call your cousins who live nearby. You decide together what to do next.
      de: Du rufst deine Cousine an, die in der Nähe wohnt. Ihr plant die nächsten
        Schritte gemeinsam.
    responseFlag: familyReaction
    responses:
      - text:
