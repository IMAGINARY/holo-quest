    responseFlag: surveyConsent
    responses:
      - text:
          en: No, I do not give my consent.
          de: Nein, ich willige nicht ein.
        value: 0
      - text:
          en: Yes, I give my consent.
          de: Ja, ich willige ein.
        value: 1
        then: survey-data
  - id: survey-data
    text:
      en: Would you like to answer 3 quick questions about yourself?
      de: Möchtest du uns noch 3 Fragen zu dir beantworten?
    responses:
      - text:
          en: 'No, restart'
          de: 'Nein, zum Neustart'
      - text:
          en: 'Yes'
          de: 'Ja'
        then: survey-q-age
  - id: survey-questions
    type: sequence
    items:
      - id: survey-q-age
        text:
          en: "Question 1/3: How old are you?"
          de: "Frage 1/3: Wie alt bist du?"
        responseControl: drum
        responseFlag: surveyAge
        responses:
          - text:
              en: Under 18
              de: unter 18
            value: "<18"
          - text:
              en: 18–24
              de: 18-24
            value: "18-24"
          - text:
              en: 25–34
              de: 25-34
            value: "25-34"
          - text:
              en: 35–44
              de: 35-44
            value: "35-44"
          - text:
              en: 45–54
              de: 45-54
            value: "45-54"
          - text:
              en: 55–64
              de: 55-64
            value: "55-64"
          - text:
              en: 65 or older
              de: 65 oder älter
            value: "65+"
          - text:
              en: Prefer not to say
              de: keine Angabe
            value: "no-answer"
      - id: survey-q-gender
        text:
          en: "Question 2/3: What gender do you identify as?"
          de: "Frage 2/3: Mit welchem Geschlecht identifizierst du dich?"
        responseControl: drum
        responseFlag: surveyGender
        responses:
          - text:
              en: Woman
              de: Frau
            value: woman
          - text:
              en: Man
              de: Mann
            value: man
          - text:
              en: Non-binary / other
              de: Divers
            value: non-binary
          - text:
              en: Prefer not to say
              de: keine Angabe
            value: "no-answer"
      - id: survey-q-education
        text:
          en: "Question 3/3: What is your highest level of education?"
          de: "Frage 3/3: Was ist dein höchster Bildungsabschluss?"
        responseControl: drum
        responseFlag: surveyEducation
        responses:
          - text:
              en: Left school without qualifications
              de: Schule beendet ohne Abschluss
            value: no-qualifications
          - text:
              en: Still in school
              de: Noch in der Schule ohne Abschluss
            value: still-in-school
          - text:
              en: Lower secondary school certificate
              de: Volks/Hauptschulabschluss
            value: hauptschule
          - text:
              en: Intermediate secondary school certificate
              de: Mittlere Reife, Realschul- oder gleichwertiger Abschluss
            value: mittlere-reife
          - text:
              en: Vocational college entrance qualification
              de: Fachabitur, Fachhochschulreife
            value: fachabitur
          - text:
              en: University entrance qualification (A-levels or equivalent)
              de: Abitur, Hochschulreife
            value: abitur
          - text:
              en: University degree
              de: Fachhochschul-/Hochschulabschluss
            value: university-degree
          - text:
              en: Doctorate
              de: Promotion
            value: doctorate
          - text:
              en: Prefer not to say
              de: keine Angabe
            value: "no-answer"
      - id: survey-end
        text:
          en: Thank you!
          de: Danke!
